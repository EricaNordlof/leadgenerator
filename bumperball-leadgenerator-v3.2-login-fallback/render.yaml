envVarGroups:
  - name: bumperball-shared-config
    envVars:
      - key: CRON_SECRET
        generateValue: true

      - key: BUSINESS_NAME
        value: Nordlöf Nordic

      - key: BRAND_NAME
        value: Offroad Bumpis

      - key: BUSINESS_PHONE
        value: "0793442520"

      - key: BUSINESS_EMAIL
        value: kontakt@offroadbumpis.se

      - key: BUSINESS_WEBSITE
        value: https://offroadbumpis.se

      - key: ADMIN_EMAIL
        value: kontakt@offroadbumpis.se

      - key: ADMIN_NAME
        value: Erica Nordlöf

      - key: SKOLVERKET_ENABLED
        value: "true"

      - key: SKOLVERKET_URL
        value: https://api.skolverket.se/skolenhetsregistret/v2/school-units

      - key: OVERPASS_URL
        value: https://overpass-api.de/api/interpreter

      - key: DISCOVERY_BBOX
        value: "55.30,12.35,56.50,14.75"

      - key: DISCOVERY_MAX_NEW
        value: "80"

      - key: DISCOVERY_USER_AGENT
        value: "OffroadBumpisLeadgenerator/3.2 (kontakt@offroadbumpis.se)"

      - key: CREATE_DAILY_DIGEST_DRAFT
        value: "true"

      - key: BOOKING_APP_URL
        value: https://offroad-bumpis-booking.onrender.com


services:
  - type: web
    name: bumperball-leadgenerator-v3
    rootDir: bumperball-leadgenerator-v3.2-login-fallback
    runtime: node
    plan: free
    region: frankfurt

    buildCommand: npm install --omit=dev
    startCommand: npm start

    healthCheckPath: /api/health
    autoDeployTrigger: commit

    envVars:
      - fromGroup: bumperball-shared-config

      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: bumperball-leads-db
          property: connectionString

      - key: SESSION_SECRET
        generateValue: true

      - key: APP_ENCRYPTION_KEY
        generateValue: true

      - key: ADMIN_PASSWORD
        sync: false

      - key: GMAIL_CLIENT_ID
        sync: false

      - key: GMAIL_CLIENT_SECRET
        sync: false

      - key: PUBLIC_FEED_URLS
        value: ""

      - key: PUBLIC_FEED_ALLOWED_DOMAINS
        value: ""

      - key: BOOKING_WEBHOOK_URL
        value: ""

      - key: BOOKING_WEBHOOK_SECRET
        sync: false


  - type: cron
    name: bumperball-daily-leads
    rootDir: bumperball-leadgenerator-v3.2-login-fallback
    runtime: node
    plan: starter
    region: frankfurt

    schedule: "0 5 * * *"

    buildCommand: npm install --omit=dev
    startCommand: npm run trigger-discovery

    envVars:
      - fromGroup: bumperball-shared-config

      - key: WEB_HOSTPORT
        fromService:
          type: web
          name: bumperball-leadgenerator-v3
          property: hostport


databases:
  - name: bumperball-leads-db
    plan: basic-256mb
    diskSizeGB: 1
    region: frankfurt
    postgresMajorVersion: "18"
    databaseName: bumperball_leads
    user: bumperball_admin
